name: Deploy PolyGo to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create public app configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL secret is empty. Go to Settings > Secrets and variables > Actions > Repository secrets and set SUPABASE_URL to the full Project URL (https://xxxx.supabase.co)."
            exit 1
          fi
          if [[ "$SUPABASE_URL" != https://* ]]; then
            echo "::error::SUPABASE_URL secret ('$SUPABASE_URL') does not start with https://. It must be the full Project URL, not just the project ref."
            exit 1
          fi
          if [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::SUPABASE_PUBLISHABLE_KEY secret is empty. Go to Settings > Secrets and variables > Actions > Repository secrets and set it."
            exit 1
          fi
          cp config.example.js config.js
          sed -i "s|YOUR_SUPABASE_URL|$SUPABASE_URL|" config.js
          sed -i "s|YOUR_SUPABASE_PUBLISHABLE_KEY|$SUPABASE_PUBLISHABLE_KEY|" config.js
          echo "Configured SUPABASE_URL host: $(echo $SUPABASE_URL | sed -E 's#https://([^/]+).*#\1#')"
      - name: Bust caches for this deploy
        run: |
          sed -i "s|\./config\.js|./config.js?v=${GITHUB_SHA}|" app.js
          sed -i "s|app\.js?v=[^\"']*|app.js?v=${GITHUB_SHA}|" index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy Edge Functions and set secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN secret not set yet, skipping Edge Function deploy. Add it in Settings > Secrets and variables > Actions once you have a Supabase personal access token."
            exit 0
          fi
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY secret not set yet, skipping Edge Function deploy. Add it once you have an Anthropic API key."
            exit 0
          fi
          PROJECT_REF=$(echo "$SUPABASE_URL" | sed -E 's#https://([^.]+)\..*#\1#')
          supabase functions deploy extract-words --project-ref "$PROJECT_REF"
          supabase functions deploy ask-ai --project-ref "$PROJECT_REF"
          supabase secrets set "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY" --project-ref "$PROJECT_REF"
