name: iOS Release

# Manual only: iOS has no local Simulator without a Mac, so every run here
# costs a real CI round-trip. Two lanes:
#   bootstrap_match - one-time (or cert-rotation) setup of fastlane match's
#                      encrypted certs/profiles. Run this once before "beta"
#                      ever works.
#   beta            - build a signed release IPA and upload it to TestFlight.
on:
  workflow_dispatch:
    inputs:
      lane:
        description: 'Fastlane lane to run'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
          - bootstrap_match

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        # Apple now requires builds submitted to App Store Connect to use the iOS 26 SDK
        # (Xcode 26+) - pin explicitly instead of trusting whatever xcode-select defaults
        # to on the runner image, which can lag behind.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        # --cache points at a fresh, run-scoped directory instead of the macOS runner's
        # pre-seeded ~/.npm cache, which occasionally throws EEXIST on its cacache tmp
        # files (a known npm/GitHub Actions macOS runner flake, not a project issue).
        run: npm ci --cache ${{ runner.temp }}/npm-cache

      - name: Generate app configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
        run: bash scripts/generate-config.sh

      - name: Build web assets and sync into iOS project
        run: |
          npm run sync:www
          npx cap sync ios

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios/App

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: pod install

      - name: Run fastlane lane
        working-directory: ios/App
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bundle exec fastlane ${{ inputs.lane }}
